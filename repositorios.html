<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorios - Mi Portafolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- SEO y PWA -->
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="manifest" href="site.webmanifest">
    <meta property="og:title" content="Mi Portafolio - Rodrigo">
    <meta property="og:description" content="Portafolio y blog personal sobre desarrollo, Linux y ciberseguridad.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1555099962-4199c345e5dd?q=80&w=800&auto=format&fit=crop">
</head>


<body>

    <header>
        <nav class="surface">
            <h1>Mi Portafolio</h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="acerca-de.html">Acerca de</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="repositorios.html" style="color: var(--accent-color);">Repositorios</a></li>
                <li><a href="blog.html">Mi Blog</a></li>
            </ul>
            
            <div class="theme-toggle-container">
                <label class="toggle-switch" aria-label="Cambiar tema">
                    <input type="checkbox" id="theme-switch">
                    <span class="slider"></span>
                </label>
            </div>
        </nav>
    </header>

    <main>
        <div class="repos-header">
            <h2>Mis Repositorios</h2>
            <p>Todos mis proyectos públicos alojados en GitHub.</p>
        </div>

        <ul class="repos-list" id="all-repos-list">
            <li class="surface">
                <strong style="color: var(--accent-color);">Cargando repositorios...</strong>
                <p class="repos-desc">Espera un momento.</p>
            </li>
        </ul>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Rodrigo47363. Construido con pasión y código.</p>
    </footer>

    <script>
        function toggleDarkMode(e) {
            if (e.target.checked) {
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const checkbox = document.getElementById('theme-switch');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                if (checkbox) checkbox.checked = true;
            } else {
                document.body.classList.remove('light-mode');
                if (checkbox) checkbox.checked = false;
            }
        }

        async function loadAllRepos() {
            const reposList = document.getElementById('all-repos-list');
            try {
                // Fetching up to 100 repositories
                const response = await fetch('https://api.github.com/users/rodrigo47363/repos?sort=updated&per_page=100');
                if (!response.ok) throw new Error(`Error: ${response.statusText}`);

                const repos = await response.json();
                reposList.innerHTML = '';
                
                repos.forEach(repo => {
                    const listItem = document.createElement('li');
                    listItem.className = 'surface';
                    
                    // Icons using text for simplicity without external libraries
                    const starIcon = '★';
                    const forkIcon = '⑂';

                    listItem.innerHTML = `
                        <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                        <p class="repos-desc">${repo.description || 'Sin descripción'}</p>
                        <div class="repo-stats">
                            <span>${starIcon} ${repo.stargazers_count}</span>
                            <span>${forkIcon} ${repo.forks_count}</span>
                            <span>${repo.language || 'N/A'}</span>
                        </div>
                    `;
                    reposList.appendChild(listItem);
                });
            } catch (error) {
                console.error('Error cargando repositorios:', error.message);
                reposList.innerHTML = '<li class="surface"><strong style="color: #ef4444;">Error</strong><p class="repos-desc">No se pudieron cargar los repositorios.</p></li>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme(); 
            const themeSwitch = document.getElementById('theme-switch');
            if (themeSwitch) {
                themeSwitch.addEventListener('change', toggleDarkMode);
            }
            loadAllRepos();
        });
    </script>
    <script src="js/animations.js"></script>
</body>
</html>
