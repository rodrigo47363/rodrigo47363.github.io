<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#1a1412"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6633"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6633" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff6633" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="440" rx="16" fill="url(#bgGrad)"/>
  <rect width="800" height="440" rx="16" fill="url(#glowGrad)"/>
  <rect width="800" height="440" rx="16" fill="none" stroke="#ff6633" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Tactical Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="440"/>
    <line x1="320" y1="0" x2="320" y2="440"/>
    <line x1="480" y1="0" x2="480" y2="440"/>
    <line x1="640" y1="0" x2="640" y2="440"/>
  </g>

  <!-- Terminal Window Mockup -->
  <g transform="translate(40, 40)">
    <!-- Terminal Bar -->
    <rect width="720" height="360" rx="10" fill="#090d13" stroke="#252f3f" stroke-width="1"/>
    <rect width="720" height="36" rx="10" fill="#131924"/>
    <rect y="26" width="720" height="10" fill="#131924"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="18" r="5.5" fill="#f59e0b"/>
    <circle cx="56" cy="18" r="5.5" fill="#10b981"/>
    
    <text x="360" y="23" font-family="'Fira Code', monospace" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="500">rodrigo@parrot: ~/Projects/AutoBurp (bash)</text>

    <!-- Burp Suite Glowing Hexagon / Logo -->
    <g transform="translate(580, 70)" filter="url(#glow)">
      <polygon points="50,0 95,26 95,78 50,104 5,78 5,26" fill="#ff6633" opacity="0.15" stroke="#ff6633" stroke-width="2"/>
      <text x="50" y="60" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="#ff6633" text-anchor="middle">BURP</text>
      <text x="50" y="76" font-family="'Fira Code', monospace" font-weight="600" font-size="9" fill="#ff9966" text-anchor="middle">SUITE</text>
    </g>

    <!-- Terminal Code Execution -->
    <g transform="translate(25, 65)" font-family="'Fira Code', monospace" font-size="13">
      <!-- Command line -->
      <text y="20" fill="#10b981" font-weight="700">rodrigo@parrot<tspan fill="#64748b">:</tspan><tspan fill="#3b82f6">~/AutoBurp</tspan><tspan fill="#e2e8f0">$ </tspan><tspan fill="#f8fafc" font-weight="500">sudo ./autoburp.sh --install --pro</tspan></text>
      
      <!-- Execution telemetry -->
      <text y="52" fill="#64748b">[<tspan fill="#3b82f6" font-weight="700">*</tspan>] AutoBurp v1.4.0 — Tactical Deployment &amp; Aprovisioning Engine</text>
      <text y="78" fill="#64748b">[<tspan fill="#10b981" font-weight="700">+</tspan>] Verificando dependencias: <tspan fill="#38bdf8">curl</tspan>, <tspan fill="#38bdf8">grep -P</tspan>, <tspan fill="#38bdf8">ca-certificates</tspan> [OK]</text>
      <text y="104" fill="#64748b">[<tspan fill="#10b981" font-weight="700">+</tspan>] Analizando entorno OpenJDK 21 LTS headless y XDG runtime...</text>
      <text y="130" fill="#64748b">[<tspan fill="#ff6633" font-weight="700">⚡</tspan>] PortSwigger DOM scraping activo: Descargando última release oficial</text>
      <text y="156" fill="#64748b">[<tspan fill="#10b981" font-weight="700">+</tspan>] Enlazando lanzador bare-metal: <tspan fill="#f59e0b">/usr/local/bin/burpsuite</tspan></text>
      <text y="182" fill="#64748b">[<tspan fill="#10b981" font-weight="700">+</tspan>] Integración de escritorio XDG y atajo de teclado completados.</text>
      <text y="208" fill="#10b981" font-weight="600">[✓] Despliegue idempotente finalizado con éxito. Cero fricción de setup.</text>

      <!-- Tactical Tag Badges inside terminal preview -->
      <g transform="translate(0, 240)">
        <rect width="130" height="26" rx="6" fill="#1e293b" stroke="#ff6633" stroke-width="1"/>
        <text x="65" y="17" font-size="11" fill="#ff6633" text-anchor="middle" font-weight="600">PortSwigger API</text>

        <rect x="142" width="130" height="26" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="207" y="17" font-size="11" fill="#34d399" text-anchor="middle" font-weight="600">Bash Idempotente</text>

        <rect x="284" width="120" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="344" y="17" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="600">OpenJDK 21</text>

        <rect x="416" width="105" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
        <text x="468" y="17" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="600">Zero Setup</text>
      </g>
    </g>
  </g>
</svg>
