<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://giscus.app https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://giscus.app https://cdnjs.cloudflare.com; img-src 'self' https://avatars.githubusercontent.com https://img.shields.io https://images.unsplash.com https://academy.hackthebox.com https://www.hackthebox.com https://tryhackme-badges.s3.amazonaws.com https://github-stats-extended.vercel.app https://streak-stats.demolab.com https://readme-typing-svg.demolab.com https://secure.gravatar.com data:; connect-src 'self' https://api.github.com; font-src 'self' https://fonts.gstatic.com; form-action 'self' https://formspree.io; frame-src https://giscus.app; object-src 'none'; base-uri 'self';">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{description}}">
    <meta name="author" content="Rodrigo47363">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="canonical" href="{{canonical_url}}">
    
    <!-- Open Graph / Redes Sociales -->
    <meta property="og:site_name" content="Rodrigo47363 | Pentesting &amp; Software Architecture">
    <meta property="og:title" content="{{title}} - Mi Portafolio">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="{{og_image}}">
    <meta property="og:url" content="{{canonical_url}}">
    <meta property="og:type" content="{{og_type}}">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{title}} - Mi Portafolio">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="{{og_image}}">
    <meta name="theme-color" content="#3b82f6">
    <title>{{title}} - Mi Portafolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- AOS Animation CSS con verificación SRI -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" integrity="sha384-/rJKQnzOkEo+daG0jMjU1IwwY9unxt1NBw3Ef2fmOJ3PW/TfAg2KXVoWwMZQZtw9" crossorigin="anonymous">
    
    <!-- Highlight.js Syntax Highlighting CSS con verificación SRI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" integrity="sha384-oaMLBGEzBOJx3UHwac0cVndtX5fxGQIfnAeFZ35RTgqPcYlbprH9o9PUV/F8Le07" crossorigin="anonymous">
    
    <link rel="icon" type="image/svg+xml" href="{{base_path}}icons/favicon.svg">
    <link rel="alternate" type="application/rss+xml" title="Blog de Rodrigo47363" href="{{base_path}}rss.xml">
    
    <link rel="stylesheet" href="{{base_path}}css/style.css">
    <!-- Scripts con carga diferida y verificación de integridad SRI -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js" integrity="sha384-wziAfh6b/qT+3LrqebF9WeK4+J5sehS6FA10J1t3a866kJ/fvU5UwofWnQyzLtwu" crossorigin="anonymous" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous" defer></script>
    <script src="{{base_path}}js/main.js" defer></script>
    
    {{extra_head}}
</head>

<body>
    <!-- Enlace de accesibilidad para lectores de pantalla y navegación por teclado -->
    <a href="#main-content" class="skip-to-content">Saltar al contenido principal</a>

    <!-- Barra de progreso de lectura (controlada vía scroll pasivo en js/main.js) -->
    <div class="progress-container" aria-hidden="true">
        <div class="progress-bar" id="myBar"></div>
    </div>

    <header>
        <nav class="glass" aria-label="Navegación principal">
            <a href="{{base_path}}index.html" class="site-logo">Mi Portafolio</a>
            <ul>
                <li><a href="{{base_path}}index.html">Inicio</a></li>
                <li><a href="{{base_path}}pages/acerca-de.html">Acerca de</a></li>
                <li><a href="{{base_path}}pages/contacto.html">Contacto</a></li>
                <li><a href="{{base_path}}pages/repositorios.html">Repositorios</a></li>
                <li><a href="{{base_path}}pages/blog.html" {{blog_active}}>Mi Blog</a></li>
            </ul>
            
            <div class="theme-toggle-container" style="display: flex; align-items: center; gap: 15px;">
                <button class="search-trigger-btn" id="searchTriggerBtn" aria-label="Buscar (Ctrl+K)">
                    🔍 <span class="search-kbd-shortcut">Ctrl+K</span>
                </button>
                <label class="toggle-switch" aria-label="Cambiar tema">
                    <input type="checkbox" id="theme-switch" aria-label="Alternar tema claro y oscuro">
                    <span class="slider"></span>
                </label>
            </div>
        </nav>
    </header>

    {{content}}

    <footer class="footer">
        <p>&copy; 2026 Rodrigo47363. Construido con pasión y código.</p>
        <p style="font-size: 0.85em; opacity: 0.6; margin-top: 5px;">
            <a href="{{base_path}}rss.xml" style="color: inherit; text-decoration: none;">RSS Feed 📡</a>
        </p>
    </footer>

    <!-- Modal de Búsqueda Global (Ctrl+K) -->
    <div class="global-search-modal" id="globalSearchModal" role="dialog" aria-modal="true" aria-label="Búsqueda global">
        <div class="global-search-content glass">
            <div class="global-search-header">
                <input type="text" id="globalSearchInput" placeholder="Buscar páginas, artículos, proyectos... (ESC para cerrar)" autocomplete="off" aria-label="Buscar en todo el sitio">
                <button class="global-search-close" id="globalSearchClose" aria-label="Cerrar modal de búsqueda">&times;</button>
            </div>
            <ul class="global-search-results" id="globalSearchResults" role="listbox">
                <!-- Inyectado por JS -->
            </ul>
            <div class="global-search-footer">
                <span>Usa <strong>↑</strong> <strong>↓</strong> para navegar y <strong>Enter</strong> para seleccionar</span>
            </div>
        </div>
    </div>

</body>
</html>
