<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://giscus.app https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://giscus.app https://cdnjs.cloudflare.com; img-src 'self' https://avatars.githubusercontent.com https://img.shields.io https://images.unsplash.com https://academy.hackthebox.com https://www.hackthebox.com https://tryhackme-badges.s3.amazonaws.com https://github-stats-extended.vercel.app https://streak-stats.demolab.com https://readme-typing-svg.demolab.com https://secure.gravatar.com data:; connect-src 'self' https://api.github.com; font-src 'self' https://fonts.gstatic.com; form-action 'self' https://formspree.io; frame-src https://giscus.app;">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{description}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="{{og_image}}">
    <meta property="og:type" content="{{og_type}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#3b82f6">
    <title>{{title}} - Mi Portafolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Highlight.js Syntax Highlighting CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    
    <link rel="icon" type="image/svg+xml" href="{{base_path}}icons/favicon.svg">
    <link rel="alternate" type="application/rss+xml" title="Blog de Rodrigo47363" href="{{base_path}}rss.xml">
    
    <link rel="stylesheet" href="{{base_path}}css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
    <script src="{{base_path}}js/main.js" defer></script>
    
    {{extra_head}}
    
    <!-- Reading Progress Bar Style -->
    <style>
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }
        .progress-bar {
            height: 4px;
            background: var(--accent-color);
            width: 0%;
            box-shadow: 0 0 10px var(--accent-color);
        }
    </style>
</head>

<body>
    <!-- Barra de progreso de lectura -->
    <div class="progress-container">
        <div class="progress-bar" id="myBar"></div>
    </div>

    <header>
        <nav class="glass">
            <h1>Mi Portafolio</h1>
            <ul>
                <li><a href="{{base_path}}index.html">Inicio</a></li>
                <li><a href="{{base_path}}pages/acerca-de.html">Acerca de</a></li>
                <li><a href="{{base_path}}pages/contacto.html">Contacto</a></li>
                <li><a href="{{base_path}}pages/repositorios.html">Repositorios</a></li>
                <li><a href="{{base_path}}pages/blog.html" {{blog_active}}>Mi Blog</a></li>
            </ul>
            
            <div class="theme-toggle-container" style="display: flex; align-items: center; gap: 15px;">
                <button class="search-trigger-btn" id="searchTriggerBtn" aria-label="Buscar (Ctrl+K)">
                    🔍 <span class="search-kbd-shortcut">Ctrl+K</span>
                </button>
                <label class="toggle-switch" aria-label="Cambiar tema">
                    <input type="checkbox" id="theme-switch">
                    <span class="slider"></span>
                </label>
            </div>
        </nav>
    </header>

    {{content}}

    <footer class="footer">
        <p>&copy; 2026 Rodrigo47363. Construido con pasión y código.</p>
        <p style="font-size: 0.85em; opacity: 0.6; margin-top: 5px;">
            <a href="{{base_path}}rss.xml" style="color: inherit; text-decoration: none;">RSS Feed 📡</a>
        </p>
    </footer>
    
    <!-- AOS Animation JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true,
            offset: 100
        });

        // Reading Progress Script
        window.onscroll = function() {myFunction()};
        function myFunction() {
            var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            var scrolled = (winScroll / height) * 100;
            var bar = document.getElementById("myBar");
            if (bar) { bar.style.width = scrolled + "%"; }
        }
    </script>

    <!-- Modal de Búsqueda Global (Ctrl+K) -->
    <div class="global-search-modal" id="globalSearchModal">
        <div class="global-search-content glass">
            <div class="global-search-header">
                <input type="text" id="globalSearchInput" placeholder="Buscar páginas, artículos, proyectos... (ESC para cerrar)" autocomplete="off">
                <button class="global-search-close" id="globalSearchClose">&times;</button>
            </div>
            <ul class="global-search-results" id="globalSearchResults">
                <!-- Inyectado por JS -->
            </ul>
            <div class="global-search-footer">
                <span>Usa <strong>↑</strong> <strong>↓</strong> para navegar y <strong>Enter</strong> para seleccionar</span>
            </div>
        </div>
    </div>

</body>
</html>
