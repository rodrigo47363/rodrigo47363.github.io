            <div class="theme-toggle-container">

                </label>

    <main>
        <section class="contact-section surface">
            <h2>Ponte en Contacto</h2>
            <p>¿Tienes alguna pregunta o quieres colaborar en un proyecto? Envíame un mensaje.</p>
            
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>
                
                <button type="button" onclick="enviarCorreo()" class="btn-submit">Enviar Mensaje</button>
            </form>
        </section>

        <script>
            function enviarCorreo() {
                // Reemplaza esto con tu correo electrónico real
                const tuCorreo ="Rodrigovil@proton.me"; 

                const nombre = document.getElementById('nombre').value;
                const email = document.getElementById('email').value;
                const mensaje = document.getElementById('mensaje').value;

                if(!nombre || !email || !mensaje) {
                    alert("Por favor, completa todos los campos.");
                    return;
                }

                const subject = encodeURIComponent(`Nuevo contacto de portafolio: ${nombre}`);
                const body = encodeURIComponent(`Has recibido un nuevo mensaje de tu portafolio web.\n\nNombre: ${nombre}\nEmail del remitente: ${email}\n\nMensaje:\n${mensaje}`);
                
                // Abre el cliente de correo del usuario (Outlook, Gmail en el móvil, etc.)
                window.location.href = `mailto:${tuCorreo}?subject=${subject}&body=${body}`;
            }
        </script>

    <script>
        function toggleDarkMode(e) {
            if (e.target.checked) {
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const checkbox = document.getElementById('theme-switch');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                if (checkbox) checkbox.checked = true;
            } else {
                document.body.classList.remove('light-mode');
                if (checkbox) checkbox.checked = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme(); 
            const themeSwitch = document.getElementById('theme-switch');
            if (themeSwitch) {
                themeSwitch.addEventListener('change', toggleDarkMode);
            }
        });
    </script>
